name: Publish OnlyOfficeAgent image

on:
  workflow_dispatch:
    inputs:
      expected_digest:
        description: 'Pre-approved sha256 digest of the exact multi-architecture OCI index'
        required: true
        type: string
      image_tag:
        description: 'Docker Hub tag to publish after digest verification'
        required: false
        default: '9.3.1'
        type: string

permissions:
  contents: read

concurrency:
  group: publish-onlyoffice-agent-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/onlyoffice-agent
  IMAGE_TAG: ${{ inputs.image_tag || '9.3.1' }}
  EXPECTED_DIGEST: ${{ inputs.expected_digest }}
  IMAGE_DEFINITION: images/onlyoffice-agent

jobs:
  # Each architecture is built, loaded, and proven on its own native runner.
  # Nothing is pushed here: the sealed layout travels as an artifact.
  build:
    name: Build and prove native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      PROOF_IMAGE: localhost/onlyoffice-agent-proof:${{ matrix.arch }}
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publication inputs
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'expected_digest must be an explicit lowercase sha256 OCI-index digest; placeholders are forbidden' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag is malformed' >&2
            exit 1
          fi
          case "$ARCH/$(uname -m)" in amd64/x86_64|arm64/aarch64) ;; *) echo "runner is not native $ARCH" >&2; exit 1 ;; esac

      - name: Fix the reproducible build epoch
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct -- "$IMAGE_DEFINITION")"
          if [[ ! "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]; then
            echo 'OnlyOffice image source commit has no valid reproducible-build epoch' >&2
            exit 1
          fi
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the sealed native layout and load the same build
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/onlyoffice-agent-native-$ARCH"
          mkdir -p "$native/evidence"
          docker buildx build \
            --platform "$PLATFORM" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=false \
            --output "type=oci,dest=$native/layout,tar=false,rewrite-timestamp=true" \
            --output "type=docker,name=$PROOF_IMAGE,rewrite-timestamp=true" \
            "$IMAGE_DEFINITION"
          # The Document Server layers are large. The layout and the loaded
          # proof image hold everything later steps need, so release the cache.
          docker buildx prune --all --force >/dev/null
          node scripts/oci-layout-index.mjs describe "$native/layout" --platform "$PLATFORM" > "$native/evidence/member.json"
          docker image inspect "$PROOF_IMAGE" > "$native/evidence/image-inspect.json"
          node scripts/oci-layout-index.mjs verify-loaded "$native/evidence/member.json" "$native/evidence/image-inspect.json"

      - name: Prove tools, contract, and DocService bind interposer natively
        run: |
          set -euo pipefail
          docker run --rm --pull=never --entrypoint /bin/bash "$PROOF_IMAGE" -lc '
            set -euo pipefail
            node --version
            npm --version
            git --version
            python3 --version
            make --version
            test -x /app/ds/run-document-server.sh
            contract=/usr/local/share/ploinky/onlyoffice.contract
            interposer=/usr/local/lib/onlyoffice-docservice-loopback-bind.so
            test -f "$contract" && test ! -L "$contract"
            test "$(stat -c "%u:%g:%a" "$contract")" = 0:0:444
            test "$(sed -n "1p" "$contract")" = contract_version=5
            test "$(sed -n "4p" "$contract")" = docservice_bind_scope=docservice-port-8000
            expected="$(sed -n "s/^interposer_sha256=//p" "$contract")"
            printf "%s  %s\n" "$expected" "$interposer" | sha256sum --check --strict -
            probe="import socket, sys; s = socket.socket(); s.bind((sys.argv[2], int(sys.argv[1]))); print(s.getsockname()[0])"
            scoped() { ONLYOFFICE_DOCSERVICE_BIND_SCOPE=docservice-port-8000 LD_PRELOAD="$interposer" "$@"; }
            test "$(scoped python3 -c "$probe" 8000 0.0.0.0)" = 127.0.0.1
            test "$(scoped python3 -c "$probe" 8001 0.0.0.0)" = 0.0.0.0
            status=0
            LD_PRELOAD="$interposer" python3 -c "pass" 2>/dev/null || status=$?
            test "$status" = 126
          '

      - name: Prove Document Server starts and reports healthy natively
        run: |
          set -euo pipefail
          container=onlyoffice-agent-proof
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --pull=never --name "$container" "$PROOF_IMAGE" >/dev/null
          for _ in $(seq 1 120); do
            if docker exec "$container" python3 -c "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/healthcheck', timeout=5).read().strip() == b'true' else 1)" 2>/dev/null; then
              echo "Document Server reported healthy on $ARCH"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
              break
            fi
            sleep 5
          done
          docker logs --tail 200 "$container" >&2 || true
          echo "Document Server did not report healthy on $ARCH" >&2
          exit 1

      - name: Record native source evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/onlyoffice-agent-native-$ARCH/evidence/source-evidence.json"
          process.stdout.write(JSON.stringify({
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            workflowSha: process.env.GITHUB_SHA,
            workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
            architecture: process.env.ARCH,
            sourceDateEpoch: process.env.SOURCE_DATE_EPOCH,
          }, null, 2) + '\n');
          NODE

      - name: Upload proven native layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onlyoffice-agent-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/onlyoffice-agent-native-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    name: Verify exact OCI index, then publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download proven native layouts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: onlyoffice-agent-native-*
          path: ${{ runner.temp }}/native

      - name: Verify archive digest and platform set before registry mutation
        id: assemble
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/native"
          test "$(find "$native" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd ' ')" = 'onlyoffice-agent-native-amd64 onlyoffice-agent-native-arm64'
          node scripts/oci-layout-index.mjs assemble --out "$RUNNER_TEMP/onlyoffice-agent-index" \
            --member "linux/amd64=$native/onlyoffice-agent-native-amd64/layout" \
            --proof "linux/amd64=$native/onlyoffice-agent-native-amd64/evidence/member.json" \
            --member "linux/arm64=$native/onlyoffice-agent-native-arm64/layout" \
            --proof "linux/arm64=$native/onlyoffice-agent-native-arm64/evidence/member.json" \
            > "$RUNNER_TEMP/assembled.json"
          actual="$(jq -r .digest "$RUNNER_TEMP/assembled.json")"
          if [ "$actual" != "$EXPECTED_DIGEST" ]; then
            echo "computed OCI index $actual does not equal approved expected_digest" >&2
            exit 1
          fi

      - name: Install archive publisher
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the already-verified layout
        id: publish
        run: |
          set -euo pipefail
          destination="docker://docker.io/${IMAGE_NAME}:${IMAGE_TAG}"
          skopeo copy --all --preserve-digests "oci:$RUNNER_TEMP/onlyoffice-agent-index" "$destination"
          skopeo inspect --raw "$destination" > "$RUNNER_TEMP/registry-index.json"
          remote_digest="$(sha256sum "$RUNNER_TEMP/registry-index.json" | awk '{print "sha256:" $1}')"
          if [ "$remote_digest" != "$EXPECTED_DIGEST" ]; then
            echo "registry digest mismatch after copy: expected $EXPECTED_DIGEST, got $remote_digest" >&2
            exit 1
          fi
          node scripts/oci-layout-index.mjs verify-index "$RUNNER_TEMP/registry-index.json" --expected-digest "$EXPECTED_DIGEST" >/dev/null
          echo "digest=$remote_digest" >> "$GITHUB_OUTPUT"
          printf 'Published immutable image: `docker.io/%s@%s`\n' \
            "$IMAGE_NAME" "$remote_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect publication evidence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/onlyoffice-agent-publication-evidence"
          mkdir -p "$evidence"
          for arch in amd64 arm64; do
            if [ -d "$RUNNER_TEMP/native/onlyoffice-agent-native-$arch/evidence" ]; then
              cp -R "$RUNNER_TEMP/native/onlyoffice-agent-native-$arch/evidence" "$evidence/native-$arch"
            fi
          done
          for file in assembled.json registry-index.json; do
            if [ -f "$RUNNER_TEMP/$file" ]; then cp "$RUNNER_TEMP/$file" "$evidence/"; fi
          done

      - name: Upload publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onlyoffice-agent-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/onlyoffice-agent-publication-evidence
          if-no-files-found: warn
          retention-days: 30
