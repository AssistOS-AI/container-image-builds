name: Publish loopback-only LiveKit Egress image

on:
  workflow_dispatch:
    inputs:
      expected_digest:
        description: 'Optional sha256 digest constraint for the exact multi-architecture OCI index'
        required: false
        default: ''
        type: string
      image_tag:
        description: 'Docker Hub tag to publish after digest verification'
        required: false
        default: 'v1.9.1-ploinky-loopback'
        type: string

permissions:
  contents: read

concurrency:
  group: publish-livekit-egress-loopback
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/livekit-egress
  IMAGE_TAG: ${{ inputs.image_tag || 'v1.9.1-ploinky-loopback' }}
  EXPECTED_DIGEST: ${{ inputs.expected_digest }}
  IMAGE_DEFINITION: images/livekit-egress-loopback

jobs:
  # Each architecture is built, loaded, and proven on its own native runner.
  # Nothing is pushed here: the sealed layout travels as an artifact.
  build:
    name: Build and prove native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      PROOF_IMAGE: localhost/livekit-egress-proof:${{ matrix.arch }}
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publication inputs
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_DIGEST" && ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'expected_digest must be empty or an explicit lowercase sha256 OCI-index digest' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag is malformed' >&2
            exit 1
          fi
          case "$ARCH/$(uname -m)" in amd64/x86_64|arm64/aarch64) ;; *) echo "runner is not native $ARCH" >&2; exit 1 ;; esac

      - name: Fix the reproducible build epoch
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct -- "$IMAGE_DEFINITION")"
          if [[ ! "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Egress image definition has no valid reproducible-build epoch' >&2
            exit 1
          fi
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the sealed native layout and load the same build
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/livekit-egress-native-$ARCH"
          mkdir -p "$native/evidence"
          docker buildx build \
            --platform "$PLATFORM" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=false \
            --output "type=oci,dest=$native/layout,tar=false,rewrite-timestamp=true" \
            --output "type=docker,name=$PROOF_IMAGE,rewrite-timestamp=true" \
            "$IMAGE_DEFINITION"
          node scripts/oci-layout-index.mjs describe "$native/layout" --platform "$PLATFORM" > "$native/evidence/member.json"
          docker image inspect "$PROOF_IMAGE" > "$native/evidence/image-inspect.json"
          node scripts/oci-layout-index.mjs verify-loaded "$native/evidence/member.json" "$native/evidence/image-inspect.json"

      - name: Prove the patched binary contract natively
        run: |
          set -euo pipefail
          docker run --rm --pull=never --entrypoint sh "$PROOF_IMAGE" -lc '
            set -eu
            contract=/usr/local/share/ploinky/livekit-egress-loopback.contract
            test -f "$contract" && test ! -L "$contract"
            test "$(stat -c "%u:%g:%a" "$contract")" = 0:0:444
            test "$(sed -n "1p" "$contract")" = contract_version=5
            test "$(sed -n "2p" "$contract")" = source_commit=ba52a026bea409bde31dcc7da9ba5322e967520c
            expected="$(sed -n "s/^binary_sha256=//p" "$contract")"
            printf "%s  %s\n" "$expected" /usr/bin/egress | sha256sum --check --strict -
            test "$(/usr/bin/egress --version | awk "{print \$NF}")" = 1.9.0
          '

      - name: Prove semantic endpoints and loopback-only health listener
        run: |
          set -euo pipefail
          network=livekit-egress-loopback-smoke
          redis=livekit-egress-loopback-redis
          egress=livekit-egress-loopback-egress
          cleanup() {
            docker rm -f "$egress" "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run -d --name "$redis" --network "$network" redis:7.0.15-bookworm@sha256:352c1fdadc91926edda08f45aeb3f27f37194c2f14101229c0523a11195c96e3 >/dev/null
          printf '%s\n' \
            'api_key: smoke-key' \
            'api_secret: smoke-secret-not-a-production-credential' \
            'ws_url: ws://127.0.0.1:7880' \
            'insecure: true' \
            'redis:' \
            '  address: 127.0.0.1:6379' \
            'template_port: 7980' \
            'health_port: 7981' > /tmp/egress-smoke.yaml
          docker run -d --pull=never --name "$egress" --network "container:$redis" \
            -v /tmp/egress-smoke.yaml:/tmp/egress.yaml:ro \
            -e EGRESS_CONFIG_FILE=/tmp/egress.yaml \
            "$PROOF_IMAGE" >/dev/null
          for _ in $(seq 1 30); do
            if docker exec "$egress" curl -fsS http://127.0.0.1:7981/ >/tmp/egress-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          jq -e '.CpuLoad | numbers' /tmp/egress-health.json >/dev/null
          docker exec "$egress" curl -fsS http://127.0.0.1:7980/ | grep -Fq 'LiveKit Egress'
          docker exec "$egress" sh -c "grep -Eq '^[[:space:]]*[0-9]+:[[:space:]]+0100007F:1F2D[[:space:]]' /proc/net/tcp"
          if docker exec "$egress" sh -c "grep -Eq '^[[:space:]]*[0-9]+:[[:space:]]+00000000:1F2D[[:space:]]' /proc/net/tcp"; then
            echo 'Egress health listener is bound to every IPv4 interface' >&2
            exit 1
          fi
          if docker run --rm --pull=never --network "$network" --entrypoint curl "$PROOF_IMAGE" \
            -fsS --connect-timeout 2 "http://$redis:7981/"; then
            echo 'Egress health listener is reachable from the bridge network' >&2
            exit 1
          fi

      - name: Record native source evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/livekit-egress-native-$ARCH/evidence/source-evidence.json"
          process.stdout.write(JSON.stringify({
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            workflowSha: process.env.GITHUB_SHA,
            workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
            architecture: process.env.ARCH,
            sourceDateEpoch: process.env.SOURCE_DATE_EPOCH,
          }, null, 2) + '\n');
          NODE

      - name: Upload proven native layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livekit-egress-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/livekit-egress-native-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    name: Verify exact Egress OCI index, then publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download proven native layouts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: livekit-egress-native-*
          path: ${{ runner.temp }}/native

      - name: Verify archive digest and platform set before registry mutation
        id: assemble
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/native"
          test "$(find "$native" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd ' ')" = 'livekit-egress-native-amd64 livekit-egress-native-arm64'
          node scripts/oci-layout-index.mjs assemble --out "$RUNNER_TEMP/livekit-egress-index" \
            --member "linux/amd64=$native/livekit-egress-native-amd64/layout" \
            --proof "linux/amd64=$native/livekit-egress-native-amd64/evidence/member.json" \
            --member "linux/arm64=$native/livekit-egress-native-arm64/layout" \
            --proof "linux/arm64=$native/livekit-egress-native-arm64/evidence/member.json" \
            > "$RUNNER_TEMP/assembled.json"
          actual="$(jq -r .digest "$RUNNER_TEMP/assembled.json")"
          if [[ -n "$EXPECTED_DIGEST" && "$actual" != "$EXPECTED_DIGEST" ]]; then
            echo "computed OCI index $actual does not equal approved expected_digest" >&2
            exit 1
          fi
          echo "SEALED_DIGEST=$actual" >> "$GITHUB_ENV"

      - name: Install archive publisher
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the already-verified layout
        id: publish
        run: |
          set -euo pipefail
          destination="docker://docker.io/${IMAGE_NAME}:${IMAGE_TAG}"
          skopeo copy --all --preserve-digests "oci:$RUNNER_TEMP/livekit-egress-index" "$destination"
          skopeo inspect --raw "$destination" > "$RUNNER_TEMP/registry-index.json"
          remote_digest="$(sha256sum "$RUNNER_TEMP/registry-index.json" | awk '{print "sha256:" $1}')"
          if [ "$remote_digest" != "$SEALED_DIGEST" ]; then
            echo "registry digest mismatch after copy: expected $SEALED_DIGEST, got $remote_digest" >&2
            exit 1
          fi
          node scripts/oci-layout-index.mjs verify-index "$RUNNER_TEMP/registry-index.json" --expected-digest "$SEALED_DIGEST" >/dev/null
          echo "digest=$remote_digest" >> "$GITHUB_OUTPUT"
          printf 'Published patched Egress: `docker.io/%s@%s`\n' \
            "$IMAGE_NAME" "$remote_digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'Rebuild livekit-server-agent with this exact immutable reference before activation.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Collect publication evidence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/livekit-egress-publication-evidence"
          mkdir -p "$evidence"
          for arch in amd64 arm64; do
            if [ -d "$RUNNER_TEMP/native/livekit-egress-native-$arch/evidence" ]; then
              cp -R "$RUNNER_TEMP/native/livekit-egress-native-$arch/evidence" "$evidence/native-$arch"
            fi
          done
          for file in assembled.json registry-index.json; do
            if [ -f "$RUNNER_TEMP/$file" ]; then cp "$RUNNER_TEMP/$file" "$evidence/"; fi
          done

      - name: Upload publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livekit-egress-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/livekit-egress-publication-evidence
          if-no-files-found: warn
          retention-days: 30
