name: Publish ploinky-box image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character AssistOS-AI/ploinky commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ploinky-box-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/ploinky-box

jobs:
  resolve-source:
    name: Resolve immutable input
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.input.outputs.source_sha }}
    steps:
      - name: Require an exact immutable Ploinky source SHA
        id: input
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout immutable Ploinky source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AssistOS-AI/ploinky
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: sources/ploinky
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Verify exact clean build inputs
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git -C sources/ploinky rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C sources/ploinky status --porcelain=v1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./images/ploinky-box/Dockerfile
          build-contexts: |
            ploinky-src=./sources/ploinky
          build-args: |
            PLOINKY_SOURCE_SHA=${{ needs.resolve-source.outputs.source_sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Record architecture digest evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/${{ matrix.arch }}.txt"

      - name: Require native rootless Podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          test -e /dev/fuse
          test -e /dev/net/tun
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman unshare true

      - name: Pull and verify candidate provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | podman login --username assistos --password-stdin docker.io
          candidate="docker.io/${IMAGE_NAME}@${DIGEST}"
          podman pull "$candidate"
          test "$(podman image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate")" = '${{ matrix.platform }}'
          test "$(podman image inspect --format '{{ index .Config.Labels "io.assistos.ploinky.source-sha" }}' "$candidate")" = "$SOURCE_SHA"
          helper_version="$(podman run --rm --entrypoint /usr/local/libexec/ploinky-bwrap-launch "$candidate" --version)"
          test "$helper_version" = "ploinky-bwrap-launch-v1 source-sha=${SOURCE_SHA}"
          helper_capabilities="$(podman run --rm --entrypoint /usr/local/libexec/ploinky-bwrap-launch "$candidate" --capabilities)"
          test "$helper_capabilities" = "ploinky-bwrap-launch-v1 source-sha=${SOURCE_SHA} protocol=1 descriptor-fd=3 path-resolution=openat2-beneath-no-magiclinks-no-symlinks bwrap-fd-options=bind-fd,ro-bind-fd,ro-bind-data,perms typed-fs=dir,tmpfs,proc,dev,system-symlink,ro-data-path-file ro-data-path-hardening=sealed-memfd-ro-bind-data preexec-barrier=R/G credential-bound=4096"

      - name: Run native Bubblewrap behavior gate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate="docker.io/${IMAGE_NAME}@${DIGEST}"
          podman run --rm \
            --security-opt unmask=ALL \
            --security-opt label=disable \
            --device /dev/fuse \
            --device /dev/net/tun \
            --env "PLOINKY_SOURCE_SHA=${SOURCE_SHA}" \
            --volume "$PWD/tests/native:/opt/ploinky-native-tests:ro" \
            --entrypoint /usr/local/bin/node \
            "$candidate" \
            /opt/ploinky-native-tests/ploinky-box-bwrap.mjs \
            | tee "$RUNNER_TEMP/ploinky-box-bwrap-${{ matrix.arch }}.log"

      - name: Record native provenance evidence
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/ploinky-box-provenance-${{ matrix.arch }}.json"
          const evidence = {
            architecture: process.env.ARCH,
            image: process.env.IMAGE_NAME,
            digest: process.env.DIGEST,
            sourceSha: process.env.SOURCE_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload native gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ploinky-box-native-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/ploinky-box-bwrap-${{ matrix.arch }}.log
            ${{ runner.temp }}/ploinky-box-provenance-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload architecture digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ploinky-box-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  podman-machine-gate:
    name: Podman Machine Bubblewrap gate
    needs:
      - resolve-source
      - build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACHINE_NAME: ploinky-native-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download gated architecture digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ploinky-box-digest-*
          path: /tmp/ploinky-box-digests
          merge-multiple: true

      - name: Start a fresh Podman Machine
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            brew install podman
          fi
          podman machine init \
            --cpus 2 \
            --memory 4096 \
            --disk-size 40 \
            --now \
            "$MACHINE_NAME"
          podman info

      - name: Select the native candidate digest
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            arm64) arch=arm64 ;;
            *) echo "unsupported Podman Machine host architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          digest="$(cat "/tmp/ploinky-box-digests/${arch}.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ARCH=$arch" >> "$GITHUB_ENV"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Run the candidate under Podman Machine
        run: |
          set -euo pipefail
          candidate="docker.io/${IMAGE_NAME}@${DIGEST}"
          podman pull "$candidate"
          test "$(podman image inspect --format '{{ index .Config.Labels "io.assistos.ploinky.source-sha" }}' "$candidate")" = "$SOURCE_SHA"
          podman run --rm \
            --security-opt unmask=ALL \
            --security-opt label=disable \
            --device /dev/fuse \
            --device /dev/net/tun \
            --env "PLOINKY_SOURCE_SHA=${SOURCE_SHA}" \
            --volume "$PWD/tests/native:/opt/ploinky-native-tests:ro" \
            --entrypoint /usr/local/bin/node \
            "$candidate" \
            /opt/ploinky-native-tests/ploinky-box-bwrap.mjs \
            | tee "$RUNNER_TEMP/ploinky-box-bwrap-podman-machine-${ARCH}.log"

      - name: Upload Podman Machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ploinky-box-native-podman-machine
          path: ${{ runner.temp }}/ploinky-box-bwrap-podman-machine-*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the test Podman Machine
        if: always()
        run: podman machine rm --force "$MACHINE_NAME" || true

  merge:
    name: Publish gated run-scoped candidate index
    needs:
      - resolve-source
      - build
      - podman-machine-gate
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.confirm.outputs.digest }}
      ref: ${{ steps.confirm.outputs.ref }}
    steps:
      - name: Download architecture digest evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ploinky-box-digest-*
          path: /tmp/ploinky-box-digests
          merge-multiple: true

      - name: Verify exactly two architecture digests
        id: digests
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/ploinky-box-digests -maxdepth 1 -type f -name '*.txt' | sort)
          test "${#digest_files[@]}" -eq 2
          amd64_digest="$(cat /tmp/ploinky-box-digests/amd64.txt)"
          arm64_digest="$(cat /tmp/ploinky-box-digests/arm64.txt)"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64_digest" != "$arm64_digest"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prove the run-scoped staging tag is unused
        run: |
          set -euo pipefail
          staging="docker.io/${IMAGE_NAME}:runtime-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx imagetools inspect "$staging" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing staging tag: $staging" >&2
            exit 1
          fi
          echo "STAGING_REF=$staging" >> "$GITHUB_ENV"

      - name: Assemble and inspect the exact two-member manifest
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:io.assistos.ploinky.workflow-run=${GITHUB_RUN_ID}" \
            --annotation "index:io.assistos.ploinky.source-sha=${SOURCE_SHA}" \
            --annotation "index:io.assistos.ploinky.amd64-digest=${AMD64_DIGEST}" \
            --annotation "index:io.assistos.ploinky.arm64-digest=${ARM64_DIGEST}" \
            --tag "$STAGING_REF" \
            "docker.io/${IMAGE_NAME}@${AMD64_DIGEST}" \
            "docker.io/${IMAGE_NAME}@${ARM64_DIGEST}"
          docker buildx imagetools inspect --raw "$STAGING_REF" > "$RUNNER_TEMP/staging-index.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/staging-index.json'));
          assert.equal(index.manifests.length, 2);
          const members = new Map(index.manifests.map((entry) => [
            `${entry.platform.os}/${entry.platform.architecture}`,
            entry.digest,
          ]));
          assert.deepEqual([...members.keys()].sort(), ['linux/amd64', 'linux/arm64']);
          assert.equal(members.get('linux/amd64'), process.env.AMD64_DIGEST);
          assert.equal(members.get('linux/arm64'), process.env.ARM64_DIGEST);
          NODE
          staging_hex="$(sha256sum "$RUNNER_TEMP/staging-index.json" | cut -d ' ' -f1)"
          staging_digest="sha256:${staging_hex}"
          [[ "$staging_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "STAGING_DIGEST=$staging_digest" >> "$GITHUB_ENV"

      - name: Read-only candidate digest confirmation
        id: confirm
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$STAGING_REF" > "$RUNNER_TEMP/confirmed-candidate-index.json"
          candidate_digest="sha256:$(sha256sum "$RUNNER_TEMP/confirmed-candidate-index.json" | cut -d ' ' -f1)"
          [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$candidate_digest" = "$STAGING_DIGEST"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${candidate_digest}" > /dev/null
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          echo "ref=$STAGING_REF" >> "$GITHUB_OUTPUT"
          printf 'Published gated run-scoped candidate: `%s` (`docker.io/%s@%s`). No stable tag was changed.\n' \
            "$STAGING_REF" "$IMAGE_NAME" "$candidate_digest" >> "$GITHUB_STEP_SUMMARY"
