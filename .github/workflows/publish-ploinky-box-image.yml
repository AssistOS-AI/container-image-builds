name: Publish ploinky-box image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character AssistOS-AI/ploinky commit SHA
        required: true
        type: string
      promote_stable:
        description: Move latest and runtime only after both native proofs and candidate verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-ploinky-box-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/ploinky-box
  IMAGE_TAG: latest
  COMPATIBILITY_IMAGE_TAG: runtime

jobs:
  resolve-source:
    name: Resolve immutable input
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.input.outputs.source_sha }}
    steps:
      - name: Require an exact immutable Ploinky source SHA
        id: input
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout immutable Ploinky source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AssistOS-AI/ploinky
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: sources/ploinky
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Resolve immutable MCP SDK input from the Ploinky lock
        id: mcp_sdk
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('sources/ploinky/ploinky-box/dependencies.lock.json'));
          const repository = lock?.repositories?.['mcp-sdk'];
          if (!repository
              || !/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\.git$/.test(repository.url)
              || !/^[0-9a-f]{40}$/.test(repository.commit)) {
            throw new Error('Ploinky dependency lock has no valid immutable MCP SDK input');
          }
          const slug = repository.url.slice('https://github.com/'.length, -'.git'.length);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${slug}\ncommit=${repository.commit}\n`);
          NODE

      - name: Checkout immutable MCP SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.mcp_sdk.outputs.repository }}
          ref: ${{ steps.mcp_sdk.outputs.commit }}
          path: sources/mcp-sdk
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Verify exact clean build inputs
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          MCP_SDK_SHA: ${{ steps.mcp_sdk.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git -C sources/ploinky rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C sources/ploinky status --porcelain=v1)"
          test "$(git -C sources/mcp-sdk rev-parse HEAD)" = "$MCP_SDK_SHA"
          test -z "$(git -C sources/mcp-sdk status --porcelain=v1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./images/ploinky-box/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PLOINKY_SOURCE_SHA=${{ needs.resolve-source.outputs.source_sha }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Verify immutable native WebTTY runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          case "$ARCH/$(uname -m)" in amd64/x86_64|arm64/aarch64) ;; *) exit 1 ;; esac
          evidence="$RUNNER_TEMP/ploinky-box-native-$ARCH"
          mkdir "$evidence"
          printf '%s\n' "$DIGEST" > "$evidence/digest.txt"
          image="docker.io/${IMAGE_NAME}@${DIGEST}"
          docker pull --platform "linux/$ARCH" "$image"
          docker image inspect "$image" > "$evidence/image-inspect.json"
          runtime=(docker run --rm --platform "linux/$ARCH" --network none --read-only
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --user 1000:1000
            --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/local/bin/node)
          "${runtime[@]}" "$image" /usr/local/share/ploinky/webtty/native-probe.mjs --verify \
            > "$evidence/native-probe.json" 2> "$evidence/native-probe.stderr"
          "${runtime[@]}" "$image" --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const root = "/usr/local/share/ploinky/webtty/";
            console.log(JSON.stringify({
              probeSha256: crypto.createHash("sha256").update(fs.readFileSync(root + "native-probe.mjs")).digest("hex"),
              contract: JSON.parse(fs.readFileSync(root + "runtime-contract.json")),
            }));
          ' > "$evidence/immutable-webtty.json"
          node images/ploinky-box/verify-publication.mjs native "$evidence" sources/ploinky "$ARCH" "$DIGEST"

      - name: Upload native runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ploinky-box-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/ploinky-box-native-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 30

  merge:
    name: Publish exact multiarchitecture candidate
    needs:
      - resolve-source
      - build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout immutable Ploinky verification source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AssistOS-AI/ploinky
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: sources/ploinky
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Download native runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ploinky-box-native-*
          path: /tmp/ploinky-box-proofs

      - name: Verify both native proofs and exact source identities
        id: digests
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git -C sources/ploinky rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C sources/ploinky status --porcelain=v1)"
          node images/ploinky-box/verify-publication.mjs proofs /tmp/ploinky-box-proofs sources/ploinky >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prove the run-scoped staging tag is unused
        run: |
          set -euo pipefail
          staging="docker.io/${IMAGE_NAME}:runtime-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx imagetools inspect "$staging" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing staging tag: $staging" >&2
            exit 1
          fi
          echo "STAGING_REF=$staging" >> "$GITHUB_ENV"

      - name: Assemble and inspect the exact two-member manifest
        id: candidate
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:io.assistos.ploinky.workflow-run=${GITHUB_RUN_ID}" \
            --annotation "index:io.assistos.ploinky.workflow-attempt=${GITHUB_RUN_ATTEMPT}" \
            --annotation "index:io.assistos.ploinky.source-sha=${SOURCE_SHA}" \
            --annotation "index:io.assistos.ploinky.image-definitions-sha=${GITHUB_SHA}" \
            --annotation "index:io.assistos.ploinky.amd64-digest=${AMD64_DIGEST}" \
            --annotation "index:io.assistos.ploinky.arm64-digest=${ARM64_DIGEST}" \
            --tag "$STAGING_REF" \
            "docker.io/${IMAGE_NAME}@${AMD64_DIGEST}" \
            "docker.io/${IMAGE_NAME}@${ARM64_DIGEST}"
          evidence="$RUNNER_TEMP/ploinky-box-candidate-evidence"
          mkdir "$evidence"
          docker buildx imagetools inspect --raw "$STAGING_REF" > "$evidence/candidate-index.json"
          node images/ploinky-box/verify-publication.mjs candidate /tmp/ploinky-box-proofs sources/ploinky \
            "$evidence/candidate-index.json" > "$evidence/candidate-proof.json"
          staging_hex="$(sha256sum "$evidence/candidate-index.json" | cut -d ' ' -f1)"
          staging_digest="sha256:${staging_hex}"
          [[ "$staging_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${staging_digest}" > "$evidence/immutable-index.json"
          cmp "$evidence/candidate-index.json" "$evidence/immutable-index.json"
          docker buildx imagetools inspect --raw "$STAGING_REF" > "$evidence/confirmed-candidate-index.json"
          cmp "$evidence/candidate-index.json" "$evidence/confirmed-candidate-index.json"
          printf '%s\n' "$staging_digest" > "$evidence/digest.txt"
          printf '%s\n' "$STAGING_REF" > "$evidence/candidate-ref.txt"
          cp -R /tmp/ploinky-box-proofs "$evidence/native-proofs"
          echo "digest=$staging_digest" >> "$GITHUB_OUTPUT"
          printf 'Verified candidate: `docker.io/%s@%s`\n' "$IMAGE_NAME" "$staging_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ploinky-box-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ploinky-box-candidate-evidence
          if-no-files-found: warn
          retention-days: 30

  promote:
    name: Promote proven latest and runtime aliases
    if: ${{ inputs.promote_stable == true }}
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest and runtime compatibility alias by the exact inspected staging digest
        run: |
          set -euo pipefail
          [[ "$STAGING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "docker.io/${IMAGE_NAME}:${COMPATIBILITY_IMAGE_TAG}" \
            "docker.io/${IMAGE_NAME}@${STAGING_DIGEST}"

      - name: Read-only post-promotion digest confirmation
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" > "$RUNNER_TEMP/confirmed-latest-index.json"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}:${COMPATIBILITY_IMAGE_TAG}" > "$RUNNER_TEMP/confirmed-runtime-index.json"
          latest_digest="sha256:$(sha256sum "$RUNNER_TEMP/confirmed-latest-index.json" | cut -d ' ' -f1)"
          runtime_digest="sha256:$(sha256sum "$RUNNER_TEMP/confirmed-runtime-index.json" | cut -d ' ' -f1)"
          [[ "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$latest_digest" = "$STAGING_DIGEST"
          test "$runtime_digest" = "$STAGING_DIGEST"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${latest_digest}" > /dev/null
          printf 'Published latest and runtime: `docker.io/%s@%s`\n' "$IMAGE_NAME" "$latest_digest" >> "$GITHUB_STEP_SUMMARY"
