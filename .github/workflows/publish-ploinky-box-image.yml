name: Publish ploinky-box image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character AssistOS-AI/ploinky commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ploinky-box-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/ploinky-box
  IMAGE_TAG: runtime

jobs:
  resolve-source:
    name: Resolve immutable input
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.input.outputs.source_sha }}
    steps:
      - name: Require an exact immutable Ploinky source SHA
        id: input
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout immutable Ploinky source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AssistOS-AI/ploinky
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: sources/ploinky
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Verify exact clean build inputs
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git -C sources/ploinky rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C sources/ploinky status --porcelain=v1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./images/ploinky-box/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Record architecture digest evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/${{ matrix.arch }}.txt"

      - name: Upload architecture digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ploinky-box-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  merge:
    name: Publish exact multiarchitecture runtime
    needs:
      - resolve-source
      - build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.confirm.outputs.digest }}
    steps:
      - name: Download architecture digest evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ploinky-box-digest-*
          path: /tmp/ploinky-box-digests
          merge-multiple: true

      - name: Verify exactly two architecture digests
        id: digests
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/ploinky-box-digests -maxdepth 1 -type f -name '*.txt' | sort)
          test "${#digest_files[@]}" -eq 2
          amd64_digest="$(cat /tmp/ploinky-box-digests/amd64.txt)"
          arm64_digest="$(cat /tmp/ploinky-box-digests/arm64.txt)"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64_digest" != "$arm64_digest"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prove the run-scoped staging tag is unused
        run: |
          set -euo pipefail
          staging="docker.io/${IMAGE_NAME}:runtime-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx imagetools inspect "$staging" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing staging tag: $staging" >&2
            exit 1
          fi
          echo "STAGING_REF=$staging" >> "$GITHUB_ENV"

      - name: Assemble and inspect the exact two-member manifest
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:io.assistos.ploinky.workflow-run=${GITHUB_RUN_ID}" \
            --annotation "index:io.assistos.ploinky.source-sha=${SOURCE_SHA}" \
            --annotation "index:io.assistos.ploinky.amd64-digest=${AMD64_DIGEST}" \
            --annotation "index:io.assistos.ploinky.arm64-digest=${ARM64_DIGEST}" \
            --tag "$STAGING_REF" \
            "docker.io/${IMAGE_NAME}@${AMD64_DIGEST}" \
            "docker.io/${IMAGE_NAME}@${ARM64_DIGEST}"
          docker buildx imagetools inspect --raw "$STAGING_REF" > "$RUNNER_TEMP/staging-index.json"
          docker buildx imagetools inspect "$STAGING_REF" > "$RUNNER_TEMP/staging-inspect.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/staging-index.json'));
          assert.equal(index.manifests.length, 2);
          const members = new Map(index.manifests.map((entry) => [
            `${entry.platform.os}/${entry.platform.architecture}`,
            entry.digest,
          ]));
          assert.deepEqual([...members.keys()].sort(), ['linux/amd64', 'linux/arm64']);
          assert.equal(members.get('linux/amd64'), process.env.AMD64_DIGEST);
          assert.equal(members.get('linux/arm64'), process.env.ARM64_DIGEST);
          NODE
          staging_digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/staging-inspect.txt" | head -1)"
          [[ "$staging_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "STAGING_DIGEST=$staging_digest" >> "$GITHUB_ENV"

      - name: Move runtime by the exact inspected staging digest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            "docker.io/${IMAGE_NAME}@${STAGING_DIGEST}"

      - name: Read-only post-promotion digest confirmation
        id: confirm
        run: |
          set -euo pipefail
          staging_digest="$(docker buildx imagetools inspect "$STAGING_REF" | sed -n 's/^Digest: //p' | head -1)"
          runtime_digest="$(docker buildx imagetools inspect "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" | sed -n 's/^Digest: //p' | head -1)"
          test "$staging_digest" = "$STAGING_DIGEST"
          test "$runtime_digest" = "$STAGING_DIGEST"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${runtime_digest}" > /dev/null
          echo "digest=$runtime_digest" >> "$GITHUB_OUTPUT"
          printf 'Published immutable image: `docker.io/%s@%s`\n' "$IMAGE_NAME" "$runtime_digest" >> "$GITHUB_STEP_SUMMARY"
