name: Publish RoboTeam Agent image

on:
  push:
    branches:
      - main
    paths:
      - images/roboteam-agent/**
      - scripts/smoke-roboteam-agent.sh
      - tests/roboteam-agent-supply-chain.test.mjs
      - .github/workflows/publish-roboteam-agent-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-roboteam-agent-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/roboteam-agent
  IMAGE_TAG: runtime
  BASE_IMAGE: quay.io/podman/upstream@sha256:bc1938030b525c1a17e5488cb074077d6a25beb18cfc146d71a92bcbbd959099

jobs:
  publish:
    name: Build and push runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify exact clean image-definition inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          node --test tests/roboteam-agent-supply-chain.test.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify exact Podman base members
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$BASE_IMAGE" > "$RUNNER_TEMP/base-index.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('images/roboteam-agent/sources.lock.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/base-index.json`, 'utf8'));
          const members = new Map(index.manifests.map((entry) => [
            `${entry.platform?.os}/${entry.platform?.architecture}`,
            entry.digest,
          ]));
          for (const platform of ['linux/amd64', 'linux/arm64']) {
            assert.equal(members.get(platform), lock.podmanBase.platformManifests[platform]);
          }
          NODE

      - name: Smoke build and verify local architecture contract
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_NAME:smoke" images/roboteam-agent
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=all \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --volume "$PWD/scripts/smoke-roboteam-agent.sh:/smoke-roboteam-agent.sh:ro" \
            "$IMAGE_NAME:smoke" \
            bash /smoke-roboteam-agent.sh contract

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture runtime
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/roboteam-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.digest=sha256:bc1938030b525c1a17e5488cb074077d6a25beb18cfc146d71a92bcbbd959099
            io.assistos.roboteam.runtime-contract=roboteam-runtime-v3
          provenance: false

      - name: Verify and report published runtime
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${DIGEST}" > "$RUNNER_TEMP/published-index.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/published-index.json`, 'utf8'));
          const platforms = index.manifests.map((entry) =>
            `${entry.platform?.os}/${entry.platform?.architecture}`).sort();
          assert.deepEqual(platforms, ['linux/amd64', 'linux/arm64']);
          NODE
          printf 'Published: `docker.io/%s:%s@%s`\n' "$IMAGE_NAME" "$IMAGE_TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
