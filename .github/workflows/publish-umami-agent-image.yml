name: Publish Umami Agent image

on:
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Move umami-stack only after both native runtime gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-umami-agent-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/umami-agent
  IMAGE_TAG: umami-stack

jobs:
  build:
    name: Build and prove ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify immutable source and workflow inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          node --test tests/umami-agent-supply-chain.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify pinned runtime platform manifests
        run: |
          set -euo pipefail
          source_image="$(jq -r '.runtimeBase.image' images/umami-agent/sources.lock.json)"
          docker buildx imagetools inspect "$source_image" --raw > "$RUNNER_TEMP/umami-runtime-index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/umami-runtime-index.json" | cut -d ' ' -f1)" = "${source_image##*@}"
          for architecture in amd64 arm64; do
            expected="$(jq -r --arg platform "linux/$architecture" '.runtimeBase.platformManifests[$platform]' images/umami-agent/sources.lock.json)"
            actual="$(jq -r --arg architecture "$architecture" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' "$RUNNER_TEMP/umami-runtime-index.json")"
            test "$actual" = "$expected"
            docker buildx imagetools inspect "docker.io/${IMAGE_NAME}@${actual}" --raw > "$RUNNER_TEMP/umami-runtime-${architecture}.json"
            test "sha256:$(sha256sum "$RUNNER_TEMP/umami-runtime-${architecture}.json" | cut -d ' ' -f1)" = "$actual"
            expected_config="$(jq -r --arg platform "linux/$architecture" '.runtimeBase.platformConfigs[$platform]' images/umami-agent/sources.lock.json)"
            test "$(jq -r '.config.digest' "$RUNNER_TEMP/umami-runtime-${architecture}.json")" = "$expected_config"
          done

      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/umami-agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/AssistOS-AI/container-image-builds
          provenance: mode=max
          sbom: true

      - name: Prove exact native application and retained tools
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          evidence="$RUNNER_TEMP/umami-proof-${EXPECTED_ARCH}"
          mkdir -p "$evidence"
          docker buildx imagetools inspect "docker.io/${IMAGE_NAME}@${BUILD_DIGEST}" --raw > "$evidence/source-index.json"
          test "sha256:$(sha256sum "$evidence/source-index.json" | cut -d ' ' -f1)" = "$BUILD_DIGEST"
          native_digest="$(node images/umami-agent/verify-publication.mjs native-index "$evidence" "$EXPECTED_ARCH")"
          image="docker.io/${IMAGE_NAME}@${native_digest}"
          docker buildx imagetools inspect "$image" --raw > "$evidence/native-manifest.json"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker image inspect "$image" > "$evidence/image-inspect.json"
          docker run --rm --network=none --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint sh "$image" -eu -c '
              test "$(node --version)" = v22.23.1
              test "$(bun --version)" = 1.3.14
              test "$(postgres --version | cut -d " " -f3)" = 18.4
              test -f /opt/umami-mcp/dist/index.js
              test "$(stat -c "%u:%g:%a" /usr/local/share/ploinky/umami-agent-sources.json)" = 0:0:444
              test "$(stat -c "%u:%g:%a" /usr/local/share/ploinky/smoke-umami-runtime.mjs)" = 0:0:444
            '
          docker run --rm --network=none --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint node "$image" /usr/local/share/ploinky/smoke-umami-runtime.mjs 2> "$evidence/runtime-diagnostics.log" \
            | tee "$evidence/runtime-smoke.json"
          printf '%s\n' "$BUILD_DIGEST" > "$evidence/build-digest.txt"
          printf '%s\n' "$native_digest" > "$evidence/native-digest.txt"
          node images/umami-agent/verify-publication.mjs seal-native "$evidence" "$EXPECTED_ARCH"

      - name: Upload native runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umami-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/umami-proof-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: Assemble only proven native candidates
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download native proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: umami-proof-*
          path: /tmp/umami-proofs

      - name: Verify both architecture proofs
        id: digests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          node images/umami-agent/verify-publication.mjs proofs /tmp/umami-proofs >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assemble and verify immutable candidate
        id: candidate
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          staging="docker.io/${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx imagetools inspect "$staging" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing candidate tag.' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$staging" \
            "docker.io/${IMAGE_NAME}@${AMD64_DIGEST}" "docker.io/${IMAGE_NAME}@${ARM64_DIGEST}"
          evidence="$RUNNER_TEMP/umami-candidate-evidence"
          mkdir -p "$evidence"
          docker buildx imagetools inspect --raw "$staging" > "$evidence/candidate-index.json"
          node images/umami-agent/verify-publication.mjs candidate /tmp/umami-proofs "$evidence/candidate-index.json"
          candidate_digest="sha256:$(sha256sum "$evidence/candidate-index.json" | cut -d ' ' -f1)"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${candidate_digest}" > "$evidence/immutable-index.json"
          cmp "$evidence/candidate-index.json" "$evidence/immutable-index.json"
          printf '%s\n' "$candidate_digest" > "$evidence/digest.txt"
          cp -R /tmp/umami-proofs "$evidence/native-proofs"
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'Proven candidate: `docker.io/%s@%s`\n\nUmami 3.2.0 source `%s`, compiled route `%s`.\n' \
            "$IMAGE_NAME" "$candidate_digest" "$(jq -r '.umami.commit' images/umami-agent/sources.lock.json)" \
            "$(jq -r '.umami.basePath' images/umami-agent/sources.lock.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umami-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/umami-candidate-evidence
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote proven Umami convenience tag
    if: ${{ inputs.promote_stable == true }}
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote only the proven index
        env:
          CANDIDATE_DIGEST: ${{ needs.assemble.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" "docker.io/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" > "$RUNNER_TEMP/promoted-index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/promoted-index.json" | cut -d ' ' -f1)" = "$CANDIDATE_DIGEST"
          printf 'Promoted `%s:%s` to `%s`.\n' "$IMAGE_NAME" "$IMAGE_TAG" "$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
