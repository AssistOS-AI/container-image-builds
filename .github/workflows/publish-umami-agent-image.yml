name: Publish Umami Agent image

on:
  workflow_dispatch:
    inputs:
      promote_digest:
        description: Optional. An already-proven assistos/umami-agent index digest (sha256:...) to point umami-stack and latest at. When set, nothing is built.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-umami-agent-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/umami-agent
  IMAGE_TAG: umami-stack
  LATEST_TAG: latest

jobs:
  build:
    name: Build and prove ${{ matrix.platform }}
    if: ${{ inputs.promote_digest == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify immutable source and workflow inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          node --test tests/umami-agent-supply-chain.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify every pinned public base
        env:
          DOCKERHUB_USERNAME: assistos
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Node, PostgreSQL, the upstream Umami image (GeoLite2) and the legacy continuity image: index bytes, native manifests and configs.
          node images/umami-agent/verify-publication.mjs verify-bases

      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/umami-agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/AssistOS-AI/container-image-builds
          provenance: mode=max
          sbom: true

      - name: Prove exact native application and runtime stack
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          lock=images/umami-agent/sources.lock.json
          expected_node="$(jq -r '.bases.node.nodeVersion' "$lock")"
          expected_postgres="$(jq -r '.bases.postgres.postgresVersion' "$lock")"
          expected_alpine="$(jq -r '.bases.node.alpineRelease' "$lock")"
          legacy_image="$(jq -r '.continuity.legacyImage.image' "$lock")"
          evidence="$RUNNER_TEMP/umami-proof-${EXPECTED_ARCH}"
          mkdir -p "$evidence"
          docker buildx imagetools inspect "docker.io/${IMAGE_NAME}@${BUILD_DIGEST}" --raw > "$evidence/source-index.json"
          test "sha256:$(sha256sum "$evidence/source-index.json" | cut -d ' ' -f1)" = "$BUILD_DIGEST"
          native_digest="$(node images/umami-agent/verify-publication.mjs native-index "$evidence" "$EXPECTED_ARCH")"
          image="docker.io/${IMAGE_NAME}@${native_digest}"
          docker buildx imagetools inspect "$image" --raw > "$evidence/native-manifest.json"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker image inspect "$image" > "$evidence/image-inspect.json"
          docker run --rm --network=none --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            -e EXPECTED_NODE="v${expected_node}" -e EXPECTED_POSTGRES="$expected_postgres" -e EXPECTED_ALPINE="$expected_alpine" \
            --entrypoint sh "$image" -eu -c '
              test "$(node --version)" = "$EXPECTED_NODE"
              test "$(postgres --version | cut -d " " -f3)" = "$EXPECTED_POSTGRES"
              test "$(cat /etc/alpine-release)" = "$EXPECTED_ALPINE"
              for tool in postgres initdb pg_ctl pg_controldata pg_isready psql createdb su-exec npm; do command -v "$tool" > /dev/null; done
              if command -v bun > /dev/null; then echo "Bun must not be installed" >&2; exit 1; fi
              test ! -e /opt/umami-mcp
              test -f /app/ploinky-umami-build.json
              test "$(stat -c "%u:%g:%a" /usr/local/share/ploinky/umami-agent-sources.json)" = 0:0:444
              test "$(stat -c "%u:%g:%a" /usr/local/share/ploinky/smoke-umami-runtime.mjs)" = 0:0:444
            '
          docker run --rm --network=none --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint node "$image" /usr/local/share/ploinky/smoke-umami-runtime.mjs 2> "$evidence/runtime-diagnostics.log" \
            | tee "$evidence/runtime-smoke.json"
          # Existing data directory: the pinned legacy image initialises it, then the candidate starts on it.
          docker pull "$legacy_image"
          # V-A2: record the candidate's size against the legacy image it replaces.
          candidate_bytes="$(docker image inspect --format '{{.Size}}' "$image")"
          legacy_bytes="$(docker image inspect --format '{{.Size}}' "$legacy_image")"
          printf '{"candidateBytes":%s,"legacyBytes":%s,"legacyImage":"%s"}\n' "$candidate_bytes" "$legacy_bytes" "$legacy_image" > "$evidence/image-sizes.json"
          printf 'Image size (%s): candidate %s bytes, legacy %s bytes.\n' "$EXPECTED_ARCH" "$candidate_bytes" "$legacy_bytes" >> "$GITHUB_STEP_SUMMARY"
          continuity="$RUNNER_TEMP/umami-continuity-${EXPECTED_ARCH}"
          sudo install -d -o 1000 -g 1000 -m 0700 "$continuity"
          docker run --rm --network=none --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/images/umami-agent/smoke-runtime.mjs:/continuity-smoke/smoke-runtime.mjs:ro" -v "$continuity:/continuity" \
            --entrypoint node "$legacy_image" /continuity-smoke/smoke-runtime.mjs continuity-init /continuity \
            2> "$evidence/continuity-init-diagnostics.log" | tee "$evidence/continuity-init.json"
          docker run --rm --network=none --user=1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$continuity:/continuity" \
            --entrypoint node "$image" /usr/local/share/ploinky/smoke-umami-runtime.mjs continuity-verify /continuity \
            2> "$evidence/continuity-smoke-diagnostics.log" | tee "$evidence/continuity-smoke.json"
          sudo rm -rf "$continuity"
          printf '%s\n' "$BUILD_DIGEST" > "$evidence/build-digest.txt"
          printf '%s\n' "$native_digest" > "$evidence/native-digest.txt"
          node images/umami-agent/verify-publication.mjs seal-native "$evidence" "$EXPECTED_ARCH"

      - name: Upload native runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umami-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/umami-proof-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: Assemble only proven native candidates
    if: ${{ inputs.promote_digest == '' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download native proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: umami-proof-*
          path: /tmp/umami-proofs

      - name: Verify both architecture proofs
        id: digests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          node images/umami-agent/verify-publication.mjs proofs /tmp/umami-proofs >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assemble and verify immutable candidate
        id: candidate
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          staging="docker.io/${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx imagetools inspect "$staging" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing candidate tag.' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$staging" \
            "docker.io/${IMAGE_NAME}@${AMD64_DIGEST}" "docker.io/${IMAGE_NAME}@${ARM64_DIGEST}"
          evidence="$RUNNER_TEMP/umami-candidate-evidence"
          mkdir -p "$evidence"
          docker buildx imagetools inspect --raw "$staging" > "$evidence/candidate-index.json"
          node images/umami-agent/verify-publication.mjs candidate /tmp/umami-proofs "$evidence/candidate-index.json"
          candidate_digest="sha256:$(sha256sum "$evidence/candidate-index.json" | cut -d ' ' -f1)"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${candidate_digest}" > "$evidence/immutable-index.json"
          cmp "$evidence/candidate-index.json" "$evidence/immutable-index.json"
          printf '%s\n' "$candidate_digest" > "$evidence/digest.txt"
          cp -R /tmp/umami-proofs "$evidence/native-proofs"
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'Proven candidate: `docker.io/%s@%s`\n\nUmami %s source `%s`, compiled route `%s`.\n\nPromote it later with `promote_digest=%s`.\n' \
            "$IMAGE_NAME" "$candidate_digest" "$(jq -r '.umami.version' images/umami-agent/sources.lock.json)" "$(jq -r '.umami.commit' images/umami-agent/sources.lock.json)" \
            "$(jq -r '.umami.basePath' images/umami-agent/sources.lock.json)" "$candidate_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umami-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/umami-candidate-evidence
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote an already-proven candidate digest
    if: ${{ inputs.promote_digest != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify the named digest, then move both convenience tags
        env:
          PROMOTE_DIGEST: ${{ inputs.promote_digest }}
          DOCKERHUB_USERNAME: assistos
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          [[ "$PROMOTE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # An assistos/umami-agent index of exactly linux/amd64 and linux/arm64 whose configs name this Umami version and source commit.
          node images/umami-agent/verify-publication.mjs promote-check "$PROMOTE_DIGEST"
          docker buildx imagetools create \
            --tag "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" --tag "docker.io/${IMAGE_NAME}:${LATEST_TAG}" \
            "docker.io/${IMAGE_NAME}@${PROMOTE_DIGEST}"
          node images/umami-agent/verify-publication.mjs verify-tags "$PROMOTE_DIGEST" "${IMAGE_TAG},${LATEST_TAG}"
          printf 'Promoted `%s:%s` and `%s:%s` to `%s`.\n' "$IMAGE_NAME" "$IMAGE_TAG" "$IMAGE_NAME" "$LATEST_TAG" "$PROMOTE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
