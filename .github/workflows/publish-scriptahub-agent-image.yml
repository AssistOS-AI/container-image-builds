name: Publish ScriptaHub Agent image

on:
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Publish the verified image as runtime
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-scriptahub-agent-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and prove native Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate source lock and publication contract
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/scriptahub-publication.test.mjs
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('images/scriptahub-agent/sources.lock.json'));
          console.log(`revision=${lock.revision}`);
          console.log(`image=${lock.image}`);
          NODE

      - name: Checkout exact public skill sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Axiologic/ScriptaHubAgent
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false

      - name: Verify source checkout and prepare runner space
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git -C source status --porcelain=v1)"
          test -f source/.dockerignore
          test "$(uname -m)" = aarch64
          # Only unused SDKs on the disposable hosted runner are removed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build locally before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: images/scriptahub-agent/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ steps.source.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.source=https://github.com/Axiologic/ScriptaHubAgent
            io.assistos.image-definitions.revision=${{ github.sha }}

      - name: Prove offline runtime and exact deployed sources
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(docker image inspect --format '{{.Architecture}}' "$candidate")" = arm64
          evidence="$RUNNER_TEMP/scriptahub-publication"
          mkdir -p "$evidence"
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint node "$candidate" /opt/scriptahub/runtime/verify-skills.mjs /opt/scriptahub/runtime \
            > "$evidence/runtime.log" 2>&1
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/source/scriptahubAgent:/code:ro" --entrypoint node "$candidate" \
            /code/deployment/check-runtime.mjs > "$evidence/source-match.log" 2>&1
          docker image inspect "$candidate" > "$evidence/image.json"
          cp images/scriptahub-agent/sources.lock.json "$evidence/sources.lock.json"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/image-definitions-revision.txt"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified candidate and optionally runtime
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          PROMOTE_STABLE: ${{ inputs.promote_stable }}
        run: |
          set -euo pipefail
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker push "$candidate"
          docker buildx imagetools inspect --raw "$candidate" > "$RUNNER_TEMP/scriptahub-publication/manifest.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/scriptahub-publication/manifest.json" | cut -d ' ' -f1)"
          docker buildx imagetools inspect "${IMAGE}@${digest}" > /dev/null
          printf '%s\n' "$digest" > "$RUNNER_TEMP/scriptahub-publication/digest.txt"
          if test "$PROMOTE_STABLE" = true; then
            docker tag "$candidate" "${IMAGE}:runtime"
            docker push "${IMAGE}:runtime"
            docker buildx imagetools inspect --raw "${IMAGE}:runtime" > "$RUNNER_TEMP/scriptahub-publication/runtime-manifest.json"
            test "sha256:$(sha256sum "$RUNNER_TEMP/scriptahub-publication/runtime-manifest.json" | cut -d ' ' -f1)" = "$digest"
            printf 'Published `%s:runtime` → `%s` (Linux ARM64)\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Verified candidate: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain runtime and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scriptahub-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scriptahub-publication
          if-no-files-found: warn
          retention-days: 30
