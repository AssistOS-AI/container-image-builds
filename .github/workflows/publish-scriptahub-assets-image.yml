name: Publish ScriptaHub assets image

# The assets image holds only downloaded model and native files (Docling, Kokoro, Qwen, Piper and the native PDF
# engine), each checked by SHA-256 against the inventories committed in ScriptaHubAgent. The agent image takes
# them from this image by digest. Nothing is published unless the exported bytes pass an offline --exact check.

on:
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Publish the verified image as runtime
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-scriptahub-assets-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and prove ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate source lock and publication contract
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/scriptahub-publication.test.mjs
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('images/scriptahub-assets/sources.lock.json'));
          console.log(`revision=${lock.revision}`);
          console.log(`image=${lock.image}`);
          console.log(`fetch_base=${lock.fetchBase}`);
          NODE

      - name: Checkout exact public skill sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Axiologic/ScriptaHubAgent
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false

      - name: Verify source checkout and prepare runner space
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git -C source status --porcelain=v1)"
          test -f source/.dockerignore
          test "$(uname -m)" = "${{ matrix.machine }}"
          # Only unused SDKs on the disposable hosted runner are removed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build locally before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: images/scriptahub-assets/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.source.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.source=https://github.com/Axiologic/ScriptaHubAgent
            io.assistos.image-definitions.revision=${{ github.sha }}

      - name: Prove the exported assets offline against the exact inventories
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          FETCH_BASE: ${{ steps.source.outputs.fetch_base }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          test "$(docker image inspect --format '{{.Architecture}}' "$candidate")" = "$ARCH"
          evidence="$RUNNER_TEMP/scriptahub-assets"
          tree="$RUNNER_TEMP/assets-tree"
          mkdir -p "$evidence"
          # The check runs on the bytes of the built image, not on the build's own view of them.
          cid=$(docker create "$candidate" /none)
          docker cp "$cid":/assets "$tree"
          docker rm "$cid" > /dev/null
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/source:/scripta-source:ro" -v "$tree:/assets:ro" --entrypoint node "$FETCH_BASE" \
            /scripta-source/scriptahubAgent/deployment/verify-assets.mjs --skills /scripta-source/skills \
            --runtime /assets/runtime --native-build /assets/native-build --exact > "$evidence/assets.log" 2>&1 || { cat "$evidence/assets.log"; exit 1; }
          cat "$evidence/assets.log"
          rm -rf "$tree" || sudo rm -rf "$tree"
          docker image inspect "$candidate" > "$evidence/image.json"
          docker image inspect --format '{{.Size}}' "$candidate" > "$evidence/image-size.txt"
          cp images/scriptahub-assets/sources.lock.json "$evidence/sources.lock.json"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/image-definitions-revision.txt"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified candidate and optionally runtime
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          ARCH: ${{ matrix.arch }}
          PROMOTE_STABLE: ${{ inputs.promote_stable }}
        run: |
          set -euo pipefail
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker push "$candidate"
          docker buildx imagetools inspect --raw "$candidate" > "$RUNNER_TEMP/scriptahub-assets/manifest.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/scriptahub-assets/manifest.json" | cut -d ' ' -f1)"
          docker buildx imagetools inspect "${IMAGE}@${digest}" > /dev/null
          printf '%s\n' "$digest" > "$RUNNER_TEMP/scriptahub-assets/digest.txt"
          printf 'Verified candidate: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain assets and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scriptahub-assets-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/scriptahub-assets
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: Assemble proven native architectures
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Download native evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scriptahub-assets-*
          path: proofs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble and verify exact proven members before promotion
        env:
          PROMOTE_STABLE: ${{ inputs.promote_stable }}
        run: |
          set -euo pipefail
          image=docker.io/assistos/scriptahub-assets
          amd64=$(cat proofs/scriptahub-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64/digest.txt)
          arm64=$(cat proofs/scriptahub-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64/digest.txt)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="${image}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" "${image}@${amd64}" "${image}@${arm64}"
          docker buildx imagetools inspect --raw "$candidate" > index.json
          AMD64="$amd64" ARM64="$arm64" node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const index=JSON.parse(fs.readFileSync('index.json'));
          assert.equal(index.manifests.length,2);
          const members=Object.fromEntries(index.manifests.map(m=>[`${m.platform.os}/${m.platform.architecture}`,m.digest]));
          assert.deepEqual(members,{'linux/amd64':process.env.AMD64,'linux/arm64':process.env.ARM64});
          NODE
          digest="sha256:$(sha256sum index.json | cut -d ' ' -f1)"
          if test "$PROMOTE_STABLE" = true; then
            docker buildx imagetools create --tag "${image}:runtime" "${image}@${digest}"
            docker buildx imagetools inspect --raw "${image}:runtime" > runtime-index.json
            test "sha256:$(sha256sum runtime-index.json | cut -d ' ' -f1)" = "$digest"
          fi
          printf 'Verified multiarchitecture image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
