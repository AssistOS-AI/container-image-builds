name: Publish SearchAgent image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: false
        default: searxng-browser
        type: string

env:
  IMAGE_NAME: assistos/search-agent

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/search-agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Smoke pushed digest without runtime privilege
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            "docker.io/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            sh -lc 'test "$(id -u):$(id -g)" = 1000:1000 && chromium --version && /opt/search-agent/searx-pyenv/bin/python -c "import searx, flask, httpx" && node -e "require(\"puppeteer-core\")"'

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: search-agent-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-architecture manifest
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: search-agent-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "docker.io/${IMAGE_NAME}:${IMAGE_TAG}-${GITHUB_SHA}" \
            $(printf "docker.io/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools inspect "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" | tee /tmp/search-agent-manifest.txt
          grep -q 'linux/amd64' /tmp/search-agent-manifest.txt
          grep -q 'linux/arm64' /tmp/search-agent-manifest.txt
