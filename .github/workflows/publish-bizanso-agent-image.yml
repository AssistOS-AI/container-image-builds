name: Publish Bizanso Runtime Image

on:
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Move runtime after both native architecture gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-bizanso-agent-image
  cancel-in-progress: false

env:
  IMAGE_NAME: assistos/bizanso-agent
  IMAGE_TAG: runtime
  BASE_IMAGE: docker.io/assistos/ploinky-node@sha256:accd925fcbf460c1f4c7a5cd9e2d46539c615bbfad2e896cabb7556d8050a669

jobs:
  build:
    name: Build and prove ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify immutable base and workflow inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(sed -n '1s/^FROM //p' images/bizanso-agent/Dockerfile)" = "$BASE_IMAGE"

          node --test tests/bizanso-runtime.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push native architecture by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/bizanso-agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/AssistOS-AI/container-image-builds
          provenance: false

      - name: Prove the exact native runtime without network or application source
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="docker.io/${IMAGE_NAME}@${DIGEST}"
          evidence="$RUNNER_TEMP/bizanso-runtime-proof-${EXPECTED_ARCH}"
          mkdir -p "$evidence"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker image inspect "$image" > "$evidence/image-inspect.json"
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint node "$image" /opt/bizanso-runtime/smoke-runtime.mjs \
            > "$evidence/runtime.json"
          printf '%s\n' "$DIGEST" > "$evidence/digest.txt"
          node --input-type=module <<'NODE' > "$evidence/source-evidence.json"
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const root = 'images/bizanso-agent';
          const inputs = JSON.parse(fs.readFileSync(`${root}/sources.lock.json`));
          console.log(JSON.stringify({
            workflowSha: process.env.GITHUB_SHA,
            workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflowRunId: process.env.GITHUB_RUN_ID,
            architecture: process.env.EXPECTED_ARCH,
            baseImage: inputs.baseImage,
            model: inputs.model,
            packageLockSha256: createHash('sha256').update(fs.readFileSync(`${root}/package-lock.json`)).digest('hex'),
            imageDigest: process.env.DIGEST,
          }));
          NODE

      - name: Upload architecture proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bizanso-runtime-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/bizanso-runtime-proof-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble proven multiarchitecture candidate
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Checkout exact image definitions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download native architecture proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bizanso-runtime-proof-*
          path: /tmp/bizanso-runtime-proofs

      - name: Verify both successful architecture proofs
        id: digests
        run: |
          set -euo pipefail
          node images/bizanso-agent/verify-publication.mjs /tmp/bizanso-runtime-proofs >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assemble and verify only the proven native digests
        id: candidate
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          staging="docker.io/${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx imagetools inspect "$staging" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing staging tag: $staging" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$staging" \
            "docker.io/${IMAGE_NAME}@${AMD64_DIGEST}" \
            "docker.io/${IMAGE_NAME}@${ARM64_DIGEST}"
          evidence="$RUNNER_TEMP/bizanso-agent-candidate-evidence"
          mkdir -p "$evidence"
          docker buildx imagetools inspect --raw "$staging" > "$evidence/candidate-index.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/bizanso-agent-candidate-evidence/candidate-index.json`));
          assert.equal(index.manifests.length, 2);
          const members = new Map(index.manifests.map(entry => [`${entry.platform.os}/${entry.platform.architecture}`, entry.digest]));
          assert.deepEqual([...members.keys()].sort(), ['linux/amd64', 'linux/arm64']);
          assert.equal(members.get('linux/amd64'), process.env.AMD64_DIGEST);
          assert.equal(members.get('linux/arm64'), process.env.ARM64_DIGEST);
          NODE
          candidate_digest="sha256:$(sha256sum "$evidence/candidate-index.json" | cut -d ' ' -f1)"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}@${candidate_digest}" > /dev/null
          printf '%s\n' "$candidate_digest" > "$evidence/digest.txt"
          cp -R /tmp/bizanso-runtime-proofs "$evidence/native-proofs"
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'Proven candidate: `docker.io/%s@%s`\n' "$IMAGE_NAME" "$candidate_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assembled candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bizanso-agent-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bizanso-agent-candidate-evidence
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote proven Bizanso runtime convenience tag
    if: ${{ inputs.promote_stable == true }}
    needs: assemble
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: assistos
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move new stable tag by exact proven candidate digest
        env:
          CANDIDATE_DIGEST: ${{ needs.assemble.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            "docker.io/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          docker buildx imagetools inspect --raw "docker.io/${IMAGE_NAME}:${IMAGE_TAG}" > "$RUNNER_TEMP/stable-index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/stable-index.json" | cut -d ' ' -f1)" = "$CANDIDATE_DIGEST"
          printf 'Promoted `docker.io/%s:%s` -> `%s`\n' "$IMAGE_NAME" "$IMAGE_TAG" "$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
